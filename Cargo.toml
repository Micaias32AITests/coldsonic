[package]
name = "coldsonic"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.9"
directories = "6.0"
gpui-kit = { version = "0.11.0", features = ["gpui-fast"] }
lofty = "0.25"
rand = "0.10.4"
rodio = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.1", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2.0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
toml = "1.1.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
symphonia = { version = "0.5.5", features = ["all"] }  # or only the formats you use
num-traits = "0.2.19"
atomic_float = "1.1.0"
atomic_enum = "0.3.0"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 3
